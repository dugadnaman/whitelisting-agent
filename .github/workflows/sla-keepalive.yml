name: Daily SLA Alert Keepalive & Scheduler Trigger

on:
  schedule:
    # 04:20 & 04:30 UTC = 09:50 AM & 10:00 AM IST (Morning Kickoff)
    - cron: '20 4 * * *'
    - cron: '30 4 * * *'
    # 07:20 & 07:30 UTC = 12:50 PM & 01:00 PM IST (Midday Checkpoint)
    - cron: '20 7 * * *'
    - cron: '30 7 * * *'
    # 10:20 & 10:30 UTC = 03:50 PM & 04:00 PM IST (EOD Escalation)
    - cron: '20 10 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Wakeup Render Service & Trigger SLA Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service Health
        run: |
          echo "Pinging whitelisting-agent.onrender.com to ensure container is awake..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 45 https://whitelisting-agent.onrender.com/api/health)
          echo "Health Check Response:"
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Web service is awake and healthy (HTTP $STATUS)!"
          else
            echo "⚠️ Non-200 status ($STATUS). Retrying once..."
            sleep 5
            curl -f -s --max-time 45 https://whitelisting-agent.onrender.com/api/health
          fi
