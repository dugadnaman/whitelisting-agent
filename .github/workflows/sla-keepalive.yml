name: Daily SLA Alert Keepalive & Scheduler Trigger

on:
  schedule:
    # Morning Kickoff (09:50, 09:55, 10:00, 10:05 AM IST = 04:20, 04:25, 04:30, 04:35 UTC)
    - cron: '20 4 * * *'
    - cron: '25 4 * * *'
    - cron: '30 4 * * *'
    - cron: '35 4 * * *'
    # Midday Checkpoint (12:50, 12:55, 01:00, 01:05 PM IST = 07:20, 07:25, 07:30, 07:35 UTC)
    - cron: '20 7 * * *'
    - cron: '25 7 * * *'
    - cron: '30 7 * * *'
    - cron: '35 7 * * *'
    # EOD Escalation (03:50, 03:55, 04:00, 04:05 PM IST = 10:20, 10:25, 10:30, 10:35 UTC)
    - cron: '20 10 * * *'
    - cron: '25 10 * * *'
    - cron: '30 10 * * *'
    - cron: '35 10 * * *'
  workflow_dispatch:

jobs:
  keepalive_and_dispatch:
    name: Wakeup Render & Trigger SLA Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Wakeup Render Service
        run: |
          echo "Pinging whitelisting-agent.onrender.com/api/health..."
          curl -f -s --max-time 45 https://whitelisting-agent.onrender.com/api/health || true

      - name: Trigger SLA Dispatch
        run: |
          echo "Triggering SLA dispatch check on whitelisting-agent.onrender.com..."
          RESPONSE=$(curl -s -X POST https://whitelisting-agent.onrender.com/api/cron/sla-dispatch \
            -H "Content-Type: application/json" \
            -d '{"stage": "AUTO"}')
          echo "Dispatch Response: $RESPONSE"
