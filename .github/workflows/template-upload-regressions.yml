name: Template upload and whitelisting safeguards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-safeguards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install regression browser
        run: python -m playwright install --with-deps chromium
      - name: Verify extraction, connections, drafts and provider boundaries
        run: sh scripts/check-template-safeguards.sh
      - name: Build production frontend
        run: npm run build --prefix frontend
