[pytest]
pythonpath = backend .
testpaths = tests
addopts = -m "not (live_karix or live_moengage or live_deployment)"
markers =
    live_karix: read-only checks against a real configured Karix account; explicitly opt in with -m live_karix
    live_moengage: read-only checks against a real configured MoEngage workspace; explicitly opt in with -m live_moengage
    live_deployment: read-only public frontend/API ingress checks; explicitly opt in with -m live_deployment and KARIX_PRODUCTION_SMOKE_URL
