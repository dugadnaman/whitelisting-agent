services:
  karix-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karix-template-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend:/app
      - BACKEND_INTERNAL_URL=http://127.0.0.1:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - KARIX_DB_PATH=/app/data/karix_store.db
      - APPAREL_ATTRIBUTION_WORKER_URL=http://apparel-worker:8000
      - APPAREL_ATTRIBUTION_TOKEN=${APPAREL_ATTRIBUTION_TOKEN:-g9T2kP7xV4mQ8zA1wR6nH3cJ5sL0uE_bD}
    volumes:
      # Mount a directory, not a possibly-absent SQLite file. Docker creates
      # missing file bind sources as directories, which breaks sqlite3.connect.
      - ./data:/app/data
      - ./media_cache:/app/media_cache
    depends_on:
      - apparel-worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  apparel-worker:
    build:
      context: .
      dockerfile: agents/apparel-attribution/Dockerfile
    container_name: apparel-attribution-worker
    restart: unless-stopped
    environment:
      - PORT=8000
      - STORAGE_DIR=/data
      - APPAREL_ATTRIBUTION_TOKEN=${APPAREL_ATTRIBUTION_TOKEN:-g9T2kP7xV4mQ8zA1wR6nH3cJ5sL0uE_bD}
      - MOENGAGE_MODE=browser
      - MOENGAGE_DASHBOARD_URL=https://dashboard-03.moengage.com/
      - MOENGAGE_REMOTE_CDP_URL=http://apparel-browser:9222
      - MOENGAGE_BROWSER_LOGIN_URL=${MOENGAGE_BROWSER_LOGIN_URL:-https://dashboard-03.moengage.com/}
      - GOOGLE_WORKSHEET_NAME=Mastersheet
    volumes:
      - ./agents/apparel-attribution/data:/data
    depends_on:
      - apparel-browser
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  apparel-browser:
    build:
      context: .
      dockerfile: agents/apparel-attribution/RailwayBrowser/Dockerfile
    container_name: apparel-attribution-browser
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - CUSTOM_USER=operator-admin
      - PASSWORD=KarixApparelSecureAuth2026!7xV4mQ8zA1
      - APPAREL_BROWSER_STREAM_ACCESS=trusted-network
      - CHROME_CLI=--remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --disable-dev-shm-usage about:blank
      - RESTART_APP=true
      - HARDEN_DESKTOP=true
      - SELKIES_ENABLE_SHARING=false
      - SELKIES_ENABLE_COLLAB=false
    volumes:
      - ./agents/apparel-attribution/browser-profile:/config
    shm_size: "1gb"
