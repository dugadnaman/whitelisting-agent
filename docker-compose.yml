services:
  karix-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karix-template-platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/backend:/app
      - BACKEND_INTERNAL_URL=http://127.0.0.1:8000
      - JWT_SECRET=${JWT_SECRET:?Set a strong persistent JWT_SECRET in .env}
      - KARIX_GOOGLE_CLIENT_ID=${KARIX_GOOGLE_CLIENT_ID:-}
      - KARIX_GOOGLE_ALLOWED_ORIGINS=${KARIX_GOOGLE_ALLOWED_ORIGINS:-}
      - KARIX_GOOGLE_ALLOWED_DOMAINS=${KARIX_GOOGLE_ALLOWED_DOMAINS:-attributics.com}
      - KARIX_DB_PATH=/app/data/karix_store.db
      - APPAREL_ATTRIBUTION_STORAGE_DIR=/app/data/apparel-attribution
    volumes:
      # Mount a directory, not a possibly-absent SQLite file. Docker creates
      # missing file bind sources as directories, which breaks sqlite3.connect.
      - ./data:/app/data
      - ./media_cache:/app/media_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

